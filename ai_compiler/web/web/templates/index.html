<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Compiler - Generate Software from Natural Language</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            padding: 40px 20px;
        }
        
        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .quality-selector {
            margin: 20px 0;
            display: flex;
            gap: 20px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .pipeline-stages {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .stage {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 12px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            background: none;
            color: #666;
            padding: 10px 20px;
            width: auto;
            font-size: 14px;
        }
        
        .tab-btn.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
            border-radius: 0;
            background: none;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 10px;
            overflow-x: auto;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .metric-value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .example-buttons {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .example-btn {
            background: #f0f0f0;
            color: #333;
            padding: 8px 16px;
            font-size: 14px;
            width: auto;
            margin: 0;
        }
        
        .example-btn:hover {
            background: #e0e0e0;
            transform: none;
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 768px) {
            .header h1 { font-size: 2em; }
            .pipeline-stages { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Compiler</h1>
            <p>Natural Language → Structured Config → Validated → Executable</p>
        </div>
        
        <div class="card">
            <h2>📝 Generate Your Application</h2>
            
            <div class="quality-selector">
                <label>
                    <input type="radio" name="quality" value="fast"> ⚡ Fast
                </label>
                <label>
                    <input type="radio" name="quality" value="balanced" checked> ⚖️ Balanced
                </label>
                <label>
                    <input type="radio" name="quality" value="high"> 🎯 High Quality
                </label>
            </div>
            
            <textarea id="prompt" rows="4" placeholder="Example: Build a CRM with login, contacts, dashboard, and role-based access..."></textarea>
            
            <div class="example-buttons">
                <button class="example-btn" data-prompt="Build a CRM with login, contacts, dashboard, and role-based access">📊 CRM</button>
                <button class="example-btn" data-prompt="Create an e-commerce platform with products, shopping cart, and user reviews">🛒 E-commerce</button>
                <button class="example-btn" data-prompt="Build a task management app with teams, assignments, and due dates">✅ Task Manager</button>
            </div>
            
            <button id="generateBtn">🚀 Generate Application</button>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>🔄 Generating through 5-stage pipeline...</p>
                <div class="pipeline-stages">
                    <div class="stage">1️⃣ Intent Extraction</div>
                    <div class="stage">2️⃣ System Design</div>
                    <div class="stage">3️⃣ Schema Generation</div>
                    <div class="stage">4️⃣ Validation & Repair</div>
                    <div class="stage">5️⃣ Execution</div>
                </div>
            </div>
        </div>
        
        <div id="results" class="card hidden">
            <h2>✅ Generated Configuration</h2>
            
            <div class="tabs">
                <button class="tab-btn active" data-tab="overview">📊 Overview</button>
                <button class="tab-btn" data-tab="database">🗄️ Database</button>
                <button class="tab-btn" data-tab="api">🔌 API</button>
                <button class="tab-btn" data-tab="ui">🎨 UI</button>
                <button class="tab-btn" data-tab="auth">🔐 Auth</button>
            </div>
            
            <div id="overview" class="tab-content active"></div>
            <div id="database" class="tab-content"></div>
            <div id="api" class="tab-content"></div>
            <div id="ui" class="tab-content"></div>
            <div id="auth" class="tab-content"></div>
        </div>
    </div>
    
    <script>
        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(tab).classList.add('active');
            });
        });
        
        // Example buttons
        document.querySelectorAll('.example-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('prompt').value = btn.dataset.prompt;
            });
        });
        
        // Generate button
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) {
                alert('Please enter a prompt');
                return;
            }
            
            const quality = document.querySelector('input[name="quality"]:checked').value;
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('results').classList.add('hidden');
            
            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, quality })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    displayResults(result);
                } else {
                    alert('Generation failed: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('generateBtn').disabled = false;
            }
        });
        
        function displayResults(result) {
            const config = result.config;
            
            // Calculate stats
            const numTables = config.database?.tables?.length || 0;
            const numEndpoints = config.api?.endpoints?.length || 0;
            const numPages = config.ui?.pages?.length || 0;
            const numRoles = config.auth?.roles?.length || 0;
            
            // Overview tab
            document.getElementById('overview').innerHTML = `
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-value">${numTables}</div>
                        <div>Database Tables</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${numEndpoints}</div>
                        <div>API Endpoints</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${numPages}</div>
                        <div>UI Pages</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${numRoles}</div>
                        <div>User Roles</div>
                    </div>
                </div>
                <div style="margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 10px;">
                    <strong>📱 App Name:</strong> ${config.app_name}<br>
                    <strong>📦 Version:</strong> ${config.version}<br>
                    <strong>⏱️ Generation Time:</strong> ${result.metrics.total_time_seconds}s<br>
                    <strong>🔧 Repair Attempts:</strong> ${result.metrics.repair_attempts}
                </div>
            `;
            
            // Database tab
            document.getElementById('database').innerHTML = `<pre>${JSON.stringify(config.database, null, 2)}</pre>`;
            
            // API tab
            document.getElementById('api').innerHTML = `<pre>${JSON.stringify(config.api, null, 2)}</pre>`;
            
            // UI tab
            document.getElementById('ui').innerHTML = `<pre>${JSON.stringify(config.ui, null, 2)}</pre>`;
            
            // Auth tab
            document.getElementById('auth').innerHTML = `<pre>${JSON.stringify(config.auth, null, 2)}</pre>`;
            
            document.getElementById('results').classList.remove('hidden');
            
            // Scroll to results
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
